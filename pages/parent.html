<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBus — Parent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/admin.css">
  <link rel="stylesheet" href="../style/parent.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 17h1a2 2 0 1 0 4 0h6a2 2 0 1 0 4 0h1v-6l-2-5H6L4 11z"/><path d="M4 11h16"/>
          <circle cx="7.5" cy="17.5" r="0.4"/><circle cx="16.5" cy="17.5" r="0.4"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="name">SmartBus</div>
        <div class="sub">School Transport System</div>
      </div>
    </div>

    <nav class="menu">
      <a class="nav-item active" href="/pages/parent.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
        My Children
      </a>
      <a class="nav-item" href="/pages/dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>
        Fleet Tracking
      </a>
      <a class="nav-item" href="/pages/alerts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Alerts
      </a>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="profile-card">
      <img src="https://i.pravatar.cc/80?img=13" alt="Parent">
      <div class="profile-meta">
        <div class="pname" id="parent-name">Loading…</div>
        <div class="prole">Parent / Guardian</div>
      </div>
      <a class="logout-link" href="#" data-logout>Sign out</a>
    </div>
  </aside>

  <main class="main">

    <div class="topbar">
      <div>
        <h1>My Children</h1>
        <p class="welcome" id="parent-sub">Live transport updates for your children.</p>
      </div>
      <div class="top-actions">
        <div class="icon-btn" id="notif-count">🔔 Notifications</div>
      </div>
    </div>

    <div id="children-list">
      <div class="card" style="text-align:center;color:#6b7280;padding:40px;">Loading your children…</div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <h3>Notifications</h3>
          <p>Updates about your children's transport</p>
        </div>
      </div>
      <div id="parent-notifications">
        <div style="color:#6b7280;font-size:14px;padding:8px 0;">Loading…</div>
      </div>
    </div>

  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="../script/api.js"></script>
<script src="../script/toast.js"></script>
<script src="../script/auth.js"></script>
<script src="../script/parent.js"></script>
</body>
</html>
